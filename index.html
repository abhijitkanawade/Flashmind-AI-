<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070913">
<title>FlashMind AI</title>

<style>
:root {
  --glass-bg: rgba(22,27,48,.65);
  --glass-border: rgba(255,255,255,.14);
  --accent-1: #8a5cff;
  --accent-2: #24d2f2;
  --text-main: #f5f7ff;
  --text-muted: #9ba1be;
}
* { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family:system-ui,-apple-system,sans-serif;
  background:#060814;
  color:var(--text-main);
  min-height:100vh;
}
.app { max-width:850px; margin:auto; min-height:100vh; display:flex; flex-direction:column; padding:14px; }
header {
  display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px;
  background:var(--glass-bg); backdrop-filter:blur(24px);
  border:1px solid var(--glass-border); border-radius:22px;
  position:sticky; top:8px; z-index:20;
}
.brand { display:flex; align-items:center; gap:10px; }
.logo {
  width:42px; height:42px; border-radius:14px; display:grid; place-items:center; font-size:22px;
  background:linear-gradient(135deg,var(--accent-1),var(--accent-2));
}
.brand h2 { font-size:17px; }
.brand p { font-size:10px; color:var(--text-muted); }
.header-actions { display:flex; gap:6px; }
button { cursor:pointer; color:white; font-family:inherit; }
.icon-btn,.clear {
  border:1px solid var(--glass-border); background:rgba(255,255,255,.07);
  border-radius:12px; padding:9px 10px; font-size:11px;
}
button:disabled { opacity:.5; cursor:not-allowed; }

.panel {
  display:none; margin-top:10px; padding:14px; background:rgba(18,22,40,.92);
  border:1px solid var(--glass-border); border-radius:18px;
}
.panel.open { display:block; }
.panel-header { display:flex; justify-content:space-between; font-size:12px; color:var(--text-muted); margin-bottom:12px; }
.history-list { display:flex; flex-direction:column; gap:8px; max-height:220px; overflow:auto; }
.history-item {
  width:100%; text-align:left; padding:12px; border:1px solid var(--glass-border);
  border-radius:12px; background:rgba(255,255,255,.06); font-size:12px;
}
.history-item.active { border-color:var(--accent-2); }
.field { margin-bottom:12px; }
.field label { display:block; font-size:11px; color:var(--text-muted); margin-bottom:6px; }
.field select, .field textarea {
  width:100%; background:rgba(255,255,255,.07); color:white; font:inherit; font-size:13px;
  border:1px solid var(--glass-border); border-radius:12px; padding:10px; outline:0;
}
.field select option { color:#111; }
.field textarea { resize:vertical; min-height:70px; }

.welcome { text-align:center; margin:48px 0 28px; }
.brain {
  position:relative; width:92px; height:92px; margin:6px auto 36px; border-radius:50%; font-size:0;
  background:
    radial-gradient(circle at 30% 24%, rgba(255,255,255,.95) 0, rgba(255,255,255,.55) 9%, transparent 26%),
    radial-gradient(circle at 70% 82%, rgba(36,210,242,.75), transparent 55%),
    radial-gradient(circle at 50% 50%, rgba(138,92,255,.85), rgba(88,56,200,.75) 70%);
  box-shadow:inset 0 -12px 26px rgba(36,210,242,.35), inset 0 8px 18px rgba(255,255,255,.28), 0 28px 60px -12px rgba(138,92,255,.6);
  animation:float 7s ease-in-out infinite;
}
.brain::after {
  content:""; position:absolute; left:10%; right:10%; bottom:-28px; height:14px; border-radius:50%;
  background:radial-gradient(ellipse, rgba(0,0,0,.55), transparent 70%); animation:groundShadow 7s ease-in-out infinite;
}
.welcome h1 {
  font-size:clamp(28px,6.4vw,44px); font-weight:650; letter-spacing:-.025em; background:linear-gradient(90deg,#d3c4ff,#7beaff);
  background-clip:text; -webkit-background-clip:text; color:transparent;
}
.welcome p { color:var(--text-muted); font-size:13px; margin-top:10px; }
.suggestions { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:22px; }
.suggestion {
  text-align:left; padding:15px; border-radius:18px; border:1px solid var(--glass-border);
  background:var(--glass-bg); font-size:13px;
}
.suggestion span { display:block; font-size:21px; margin-bottom:8px; }

#chat { display:flex; flex-direction:column; gap:14px; flex:1; padding:12px 0 24px; }
.message { max-width:88%; padding:14px 16px; border-radius:20px; font-size:14px; line-height:1.6; overflow-wrap:anywhere; }
.user { align-self:flex-end; background:linear-gradient(135deg,rgba(138,92,255,.9),rgba(58,123,213,.9)); border-bottom-right-radius:6px; white-space:pre-wrap; }
.bot { align-self:flex-start; background:var(--glass-bg); border:1px solid var(--glass-border); border-bottom-left-radius:6px; }
.bot-label { display:flex; align-items:center; gap:7px; font-size:12px; font-weight:600; color:#b9c2ff; margin-bottom:6px; }
.bot-label::before { content:""; width:8px; height:8px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff, var(--accent-2) 55%, var(--accent-1)); box-shadow:0 0 10px rgba(36,210,242,.85); }
.msg-images { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
.msg-images img { max-width:200px; max-height:200px; border-radius:12px; object-fit:cover; cursor:zoom-in; border:1px solid rgba(255,255,255,.2); }
.md p { margin:0 0 8px; } .md p:last-child { margin-bottom:0; }
.md h1,.md h2,.md h3 { font-size:15px; margin:10px 0 6px; }
.md ul,.md ol { margin:0 0 8px 20px; }
.md code { background:rgba(255,255,255,.1); padding:1px 5px; border-radius:6px; font-size:12.5px; font-family:ui-monospace,Menlo,monospace; }
.md pre { background:rgba(0,0,0,.45); border:1px solid var(--glass-border); border-radius:12px; padding:12px; overflow-x:auto; margin:8px 0; }
.md pre code { background:none; padding:0; }
.actions { display:flex; gap:6px; margin-top:10px; }
.actions button {
  background:rgba(255,255,255,.07); border:1px solid var(--glass-border);
  border-radius:10px; font-size:11px; padding:5px 9px;
}
.typing-dots { display:flex; gap:5px; padding:5px; }
.typing-dots span { width:7px; height:7px; border-radius:50%; background:#a5b0ff; animation:pulse 1s infinite; }
.typing-dots span:nth-child(2) { animation-delay:.2s; }
.typing-dots span:nth-child(3) { animation-delay:.4s; }

.composer { position:sticky; bottom:5px; padding:8px 0; background:linear-gradient(transparent,rgba(6,8,20,.88) 38%); }
.previews { display:flex; gap:8px; flex-wrap:wrap; padding:0 4px 8px; }
.preview { position:relative; width:64px; height:64px; }
.preview img { width:100%; height:100%; object-fit:cover; border-radius:12px; border:1px solid var(--glass-border); }
.preview button {
  position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%;
  border:0; background:#ff5d73; font-size:12px; line-height:20px; padding:0;
}
.inputbox {
  display:flex; align-items:flex-end; gap:8px; background:rgba(22,27,48,.92);
  border:1px solid var(--glass-border); border-radius:22px; padding:8px 10px 8px 10px;
}
.inputbox.drag { border-color:var(--accent-2); box-shadow:0 0 0 2px rgba(36,210,242,.3); }
textarea#prompt {
  flex:1; min-width:0; background:transparent; border:0; outline:0; color:white;
  font:inherit; font-size:16px; padding:12px 0; resize:none; max-height:160px; line-height:1.4;
}
textarea#prompt::placeholder { color:#8f96b8; }
#attach {
  width:44px; height:44px; border:1px solid var(--glass-border); border-radius:15px;
  background:rgba(255,255,255,.07); font-size:20px; flex-shrink:0;
}
#send { width:44px; height:44px; border:0; border-radius:15px; background:linear-gradient(135deg,var(--accent-1),var(--accent-2)); font-size:20px; flex-shrink:0; }
.note { text-align:center; color:#7c82a2; font-size:10px; margin-top:9px; }
.toast {
  position:fixed; left:50%; bottom:110px; transform:translateX(-50%); background:#2a2f4d;
  border:1px solid var(--glass-border); padding:10px 16px; border-radius:14px; font-size:12px;
  z-index:50; display:none; max-width:90vw;
}
.lightbox { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; place-items:center; z-index:60; cursor:zoom-out; }
.lightbox.open { display:grid; }
.lightbox img { max-width:94vw; max-height:90vh; border-radius:12px; }
@keyframes pulse { 0%,80%,100% { transform:scale(.7); opacity:.4; } 40% { transform:scale(1.15); opacity:1; } }
@keyframes msgIn {
  from { opacity:0; transform:perspective(900px) translate3d(0,22px,-90px) rotateX(10deg); }
  to   { opacity:1; transform:perspective(900px) translate3d(0,0,0) rotateX(0); }
}
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
@keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-9px); } }
@keyframes groundShadow { 0%,100% { transform:scaleX(1); opacity:.6; } 50% { transform:scaleX(.78); opacity:.32; } }
@keyframes driftA { to { transform:translate3d(7vmax,5vmax,0) scale(1.1); } }
@keyframes driftB { to { transform:translate3d(-6vmax,6vmax,0) scale(1.07); } }
@keyframes driftC { to { transform:translate3d(5vmax,-5vmax,0) scale(1.12); } }

/* depth scene */
.scene { position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
.scene::after { content:""; position:absolute; inset:0; background:radial-gradient(ellipse at 50% 115%, rgba(0,0,0,.55), transparent 62%); }
.layer { position:absolute; inset:0; transition:transform .7s cubic-bezier(.2,.8,.2,1); }
.l1 { transform:translate3d(calc(var(--px,0) * -16px), calc(var(--py,0) * -16px), 0); }
.l2 { transform:translate3d(calc(var(--px,0) * -34px), calc(var(--py,0) * -34px), 0); }
.l3 { transform:translate3d(calc(var(--px,0) * -56px), calc(var(--py,0) * -56px), 0); }
.orb { position:absolute; border-radius:50%; will-change:transform; }
.orb.a { width:78vmax; height:78vmax; left:-28vmax; top:-34vmax; background:radial-gradient(circle, rgba(138,92,255,.46), transparent 62%); animation:driftA 28s ease-in-out infinite alternate; }
.orb.b { width:62vmax; height:62vmax; right:-24vmax; top:6vmax; background:radial-gradient(circle, rgba(36,210,242,.34), transparent 62%); animation:driftB 34s ease-in-out infinite alternate; }
.orb.c { width:54vmax; height:54vmax; left:18vmax; bottom:-30vmax; background:radial-gradient(circle, rgba(88,110,255,.30), transparent 64%); animation:driftC 40s ease-in-out infinite alternate; }

/* glass layers */
header,.panel,.bot,.suggestion,.inputbox {
  background:linear-gradient(145deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
  -webkit-backdrop-filter:blur(26px) saturate(1.5); backdrop-filter:blur(26px) saturate(1.5);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(255,255,255,.04), 0 24px 48px -24px rgba(0,0,0,.65), 0 2px 6px rgba(0,0,0,.25);
}
.panel { background:linear-gradient(145deg, rgba(42,46,78,.94), rgba(24,27,48,.96)); }
.user { box-shadow:inset 0 1px 0 rgba(255,255,255,.32), 0 16px 38px -14px rgba(138,92,255,.75); }
.inputbox { box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 30px 60px -26px rgba(0,0,0,.75), 0 12px 42px -16px rgba(138,92,255,.5); transition:border-color .25s ease, box-shadow .25s ease; }
.inputbox:focus-within { border-color:rgba(36,210,242,.55); box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 30px 60px -26px rgba(0,0,0,.75), 0 0 0 3px rgba(36,210,242,.15), 0 12px 42px -12px rgba(36,210,242,.4); }
button:focus-visible,select:focus-visible { outline:2px solid var(--accent-2); outline-offset:2px; }

/* tilt + specular highlight */
.tilt { position:relative; transform:perspective(900px) translateY(var(--lift,0px)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)); transition:transform .28s cubic-bezier(.2,.8,.2,1), border-color .2s ease; }
.tilt::after { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; opacity:0; transition:opacity .3s ease; background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%), rgba(255,255,255,.16), transparent 62%); }
.tilt:hover::after { opacity:1; }
.suggestion.tilt:hover { --lift:-4px; border-color:rgba(36,210,242,.5); }

/* motion that answers an action */
.message.enter { animation:msgIn .55s cubic-bezier(.2,.8,.2,1) backwards; }
.user.enter { transform-origin:right bottom; }
.bot.enter { transform-origin:left bottom; }
.md.fresh { animation:fadeIn .3s ease both; }
.welcome,.suggestions { max-height:460px; overflow:hidden; transition:opacity .35s ease,transform .4s ease,max-height .5s ease,margin .5s ease; }
.welcome.hidden,.suggestions.hidden { opacity:0; transform:translateY(-14px); max-height:0; margin-top:0; margin-bottom:0; pointer-events:none; }
.suggestion:active,#send:active,#attach:active { transform:scale(.95); }
#send,#attach,.icon-btn,.clear,.actions button { transition:transform .15s ease,opacity .2s ease,background .2s ease; }
.panel { animation:fadeIn .25s ease both; }
@media (prefers-reduced-motion: reduce) {
  *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}
.icon-btn,.clear { white-space:nowrap; }
@media(max-width:480px) {
  .brand p { display:none; }
  .brand h2 { font-size:15px; white-space:nowrap; }
  .icon-btn,.clear { padding:8px 9px; }
}
@media(max-width:380px) {
  .brand h2 { font-size:14px; }
  .icon-btn,.clear { padding:8px 7px; font-size:10px; }
  .suggestions { gap:8px; }
}
</style>
</head>

<body>
<div class="scene" aria-hidden="true">
  <div class="layer l1"><i class="orb a"></i></div>
  <div class="layer l2"><i class="orb b"></i></div>
  <div class="layer l3"><i class="orb c"></i></div>
</div>
<div class="app">

<header>
  <div class="brand">
    <div class="logo">✦</div>
    <div><h2>FlashMind AI</h2><p>Spatial Intelligence · Active</p></div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" onclick="togglePanel('historyPanel')">History</button>
    <button class="icon-btn" onclick="togglePanel('settingsPanel')">⚙︎</button>
    <button class="clear" onclick="clearChat()">New Chat</button>
  </div>
</header>

<div class="panel" id="historyPanel">
  <div class="panel-header">
    <span>Recent Conversations</span>
    <button onclick="clearAllHistory()" style="background:none;border:0;color:#ff8f9c">Clear All</button>
  </div>
  <div class="history-list" id="historyList"></div>
</div>

<div class="panel" id="settingsPanel">
  <div class="panel-header"><span>Customise FlashMind</span></div>
  <div class="field">
    <label for="tone">Response style</label>
    <select id="tone">
      <option value="balanced">Balanced</option>
      <option value="concise">Concise</option>
      <option value="detailed">Detailed</option>
      <option value="friendly">Friendly</option>
    </select>
  </div>
  <div class="field">
    <label for="mode">Mode</label>
    <select id="mode">
      <option value="normal">Quick answers</option>
      <option value="deep">Deep work (heavy tasks, longer answers)</option>
    </select>
  </div>
  <div class="field">
    <label for="custom">Custom instructions (optional)</label>
    <textarea id="custom" maxlength="1000" placeholder="e.g. I'm a Class 12 student. Explain with simple examples."></textarea>
  </div>
</div>

<section class="welcome" id="welcome">
  <div class="brain" aria-hidden="true"></div>
  <h1>What can I help with?</h1>
  <p>Ask anything, or attach an image 📎 and ask about it.</p>
</section>

<section class="suggestions" id="suggestions">
  <button class="suggestion tilt" onclick="suggest('Explain artificial intelligence simply')"><span>🧠</span>Learn something</button>
  <button class="suggestion tilt" onclick="suggest('Help me write a professional email')"><span>✍️</span>Write anything</button>
  <button class="suggestion tilt" onclick="suggest('Explain JavaScript for beginners')"><span>💻</span>Learn coding</button>
  <button class="suggestion tilt" onclick="suggest('Give me a study plan')"><span>📚</span>Study smarter</button>
</section>

<main id="chat"></main>

<div class="composer">
  <div class="previews" id="previews"></div>
  <div class="inputbox" id="inputbox">
    <button id="attach" title="Attach images" onclick="document.getElementById('file').click()">📎</button>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <textarea id="prompt" rows="1" placeholder="Ask FlashMind anything..." autocomplete="off"></textarea>
    <button id="send" onclick="onSendClick()">↑</button>
  </div>
  <p class="note">FlashMind AI · Enter to send · Shift+Enter for new line · Paste or drop images</p>
</div>

</div>

<div class="toast" id="toast"></div>
<div class="lightbox" id="lightbox" onclick="this.classList.remove('open')"><img id="lightboxImg" alt=""></div>

<script>
const input = document.getElementById("prompt");
const chat = document.getElementById("chat");
const sendBtn = document.getElementById("send");
const fileInput = document.getElementById("file");
const previewsEl = document.getElementById("previews");
const inputbox = document.getElementById("inputbox");
const historyList = document.getElementById("historyList");
const toneEl = document.getElementById("tone");
const customEl = document.getElementById("custom");
const modeEl = document.getElementById("mode");

const MAX_IMAGES = 4;
const MAX_FULL_PX = 1280;
const MAX_THUMB_PX = 420;

let conversation = [];      // {role, content, images?:[thumbDataUrl]}
let currentSessionId = null;
let isSending = false;
let abortCtl = null;
let pending = [];           // [{full, thumb}]
let lastFull = [];          // full-size images of the latest user message (for regenerate)

/* ---------- storage ---------- */
function readSessions() {
  try {
    const d = JSON.parse(localStorage.getItem("flashmind_sessions") || "[]");
    return Array.isArray(d) ? d : [];
  } catch { return []; }
}
let savedSessions = readSessions();

function persistSessions() {
  try { localStorage.setItem("flashmind_sessions", JSON.stringify(savedSessions)); return true; }
  catch (e) {
    // Storage full: drop images from saved history and retry once.
    try {
      savedSessions.forEach(s => s.messages.forEach(m => { delete m.images; }));
      localStorage.setItem("flashmind_sessions", JSON.stringify(savedSessions));
      return true;
    } catch { return false; }
  }
}
function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem("flashmind_settings") || "{}");
    if (s.tone) toneEl.value = s.tone;
    if (s.custom) customEl.value = s.custom;
    if (s.mode) modeEl.value = s.mode;
  } catch {}
}
function saveSettings() {
  try { localStorage.setItem("flashmind_settings", JSON.stringify({ tone: toneEl.value, custom: customEl.value, mode: modeEl.value })); } catch {}
}
toneEl.addEventListener("change", saveSettings);
modeEl.addEventListener("change", saveSettings);
customEl.addEventListener("input", saveSettings);

/* ---------- helpers ---------- */
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = "none", 3200);
}
function esc(s) {
  return s.replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
}
function inline(t) {
  return t.replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
}
function md(src) {
  const blocks = [];
  let t = src.replace(/```[\w-]*\n?([\s\S]*?)(```|$)/g, (m, code) => {
    blocks.push("<pre><code>" + esc(code.replace(/\n$/, "")) + "</code></pre>");
    return "\u0000" + (blocks.length - 1) + "\u0000";
  });
  t = esc(t);
  const out = []; let list = null;
  const close = () => { if (list) { out.push("</" + list + ">"); list = null; } };
  for (const line of t.split("\n")) {
    let m;
    if ((m = line.match(/^\u0000(\d+)\u0000$/))) { close(); out.push(blocks[+m[1]]); }
    else if ((m = line.match(/^\s*[-*•]\s+(.*)/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push("<li>" + inline(m[1]) + "</li>"); }
    else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; } out.push("<li>" + inline(m[1]) + "</li>"); }
    else if ((m = line.match(/^#{1,3}\s+(.*)/))) { close(); out.push("<h3>" + inline(m[1]) + "</h3>"); }
    else if (!line.trim()) { close(); }
    else { close(); out.push("<p>" + inline(line) + "</p>"); }
  }
  close();
  return out.join("");
}
function openLightbox(src) {
  document.getElementById("lightboxImg").src = src;
  document.getElementById("lightbox").classList.add("open");
}
function scrollDown(smooth) {
  const top = document.documentElement.scrollHeight;
  if (smooth) window.scrollTo({ top, behavior: "smooth" });
  else window.scrollTo(0, top);
}
// Only follow the stream while the reader is already near the bottom.
function nearBottom() {
  return window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 160;
}

/* ---------- images ---------- */
function loadBitmap(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("unreadable")); };
    img.src = url;
  });
}
function scaleTo(img, maxPx, quality) {
  const r = Math.min(1, maxPx / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(img.width * r));
  c.height = Math.max(1, Math.round(img.height * r));
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", quality);
}
async function addFiles(files) {
  const list = Array.from(files).filter(f => f.type.startsWith("image/"));
  if (!list.length) { if (files.length) toast("Only image files are supported."); return; }
  for (const f of list) {
    if (pending.length >= MAX_IMAGES) { toast("Maximum " + MAX_IMAGES + " images per message."); break; }
    try {
      const img = await loadBitmap(f);
      pending.push({ full: scaleTo(img, MAX_FULL_PX, 0.85), thumb: scaleTo(img, MAX_THUMB_PX, 0.7) });
    } catch { toast("Couldn't read \"" + f.name + "\". Try a JPG or PNG."); }
  }
  renderPreviews();
}
function renderPreviews() {
  previewsEl.innerHTML = "";
  pending.forEach((p, i) => {
    const d = document.createElement("div"); d.className = "preview";
    const im = document.createElement("img"); im.src = p.thumb; im.alt = "attachment";
    const b = document.createElement("button"); b.textContent = "×"; b.title = "Remove";
    b.onclick = () => { pending.splice(i, 1); renderPreviews(); };
    d.append(im, b); previewsEl.appendChild(d);
  });
}
fileInput.addEventListener("change", () => { addFiles(fileInput.files); fileInput.value = ""; });
input.addEventListener("paste", e => {
  const files = Array.from(e.clipboardData?.files || []).filter(f => f.type.startsWith("image/"));
  if (files.length) { e.preventDefault(); addFiles(files); }
});
// Count enter/leave so the highlight doesn't flicker over child elements.
let dragDepth = 0;
document.addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; inputbox.classList.add("drag"); });
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("dragleave", () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) inputbox.classList.remove("drag"); });
document.addEventListener("drop", e => {
  e.preventDefault(); dragDepth = 0; inputbox.classList.remove("drag");
  if (e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files);
});

/* ---------- rendering messages ---------- */
function buildMessage(msg) {
  const box = document.createElement("div");
  const isBot = msg.role !== "user";
  box.className = "message " + (isBot ? "bot tilt" : "user");

  if (isBot) {
    const label = document.createElement("div");
    label.className = "bot-label"; label.textContent = "FlashMind";
    box.appendChild(label);
  } else if (msg.images && msg.images.length) {
    const wrap = document.createElement("div"); wrap.className = "msg-images";
    msg.images.forEach(src => {
      const im = document.createElement("img"); im.src = src; im.alt = "attached image";
      im.onclick = () => openLightbox(src); wrap.appendChild(im);
    });
    box.appendChild(wrap);
  }

  const content = document.createElement("div");
  if (isBot) { content.className = "md"; content.innerHTML = md(msg.content); }
  else content.textContent = msg.content;
  box.appendChild(content);
  box._content = content;
  return box;
}
function addActions(box, text) {
  const bar = document.createElement("div"); bar.className = "actions";
  const copy = document.createElement("button"); copy.textContent = "Copy";
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText(text); copy.textContent = "Copied ✓"; setTimeout(() => copy.textContent = "Copy", 1500); }
    catch { toast("Couldn't copy."); }
  };
  const regen = document.createElement("button"); regen.textContent = "↻ Regenerate";
  regen.onclick = regenerate;
  bar.append(copy, regen); box.appendChild(bar);
}
function refreshRegenButtons() {
  chat.querySelectorAll(".actions button:nth-child(2)").forEach(b => b.style.display = "none");
  const last = chat.querySelector(".bot:last-child .actions button:nth-child(2)");
  if (last) last.style.display = "";
}
function renderAll() {
  chat.innerHTML = "";
  conversation.forEach(m => {
    const box = buildMessage(m);
    if (m.role !== "user") addActions(box, m.content);
    chat.appendChild(box);
  });
  refreshRegenButtons(); updateWelcome(); scrollDown();
}

/* ---------- sessions ---------- */
function saveCurrentSession() {
  if (!conversation.length) return;
  if (!currentSessionId) currentSessionId = String(Date.now());
  const first = conversation.find(m => m.role === "user");
  const title = (first && (first.content || (first.images ? "Image chat" : ""))).slice(0, 45) || "New Conversation";
  const session = { id: currentSessionId, title, messages: conversation, updatedAt: Date.now() };
  const i = savedSessions.findIndex(s => s.id === currentSessionId);
  if (i >= 0) savedSessions[i] = session; else savedSessions.unshift(session);
  savedSessions.sort((a, b) => b.updatedAt - a.updatedAt);
  savedSessions = savedSessions.slice(0, 30);
  persistSessions(); renderHistory();
}
function renderHistory() {
  historyList.innerHTML = "";
  if (!savedSessions.length) { historyList.textContent = "No saved conversations yet."; return; }
  savedSessions.forEach(s => {
    const b = document.createElement("button");
    b.className = "history-item" + (s.id === currentSessionId ? " active" : "");
    b.textContent = s.title || "Conversation";
    b.onclick = () => loadSession(s.id);
    historyList.appendChild(b);
  });
}
function loadSession(id) {
  if (isSending) return;
  const s = savedSessions.find(x => x.id === id); if (!s) return;
  currentSessionId = s.id;
  conversation = (s.messages || []).map(m => ({ role: m.role, content: m.content, images: m.images }));
  lastFull = [];
  renderAll(); closePanels(); renderHistory();
}
function updateWelcome() {
  const empty = conversation.length === 0;
  document.getElementById("welcome").classList.toggle("hidden", !empty);
  document.getElementById("suggestions").classList.toggle("hidden", !empty);
}
function togglePanel(id) {
  const el = document.getElementById(id), was = el.classList.contains("open");
  closePanels(); if (!was) el.classList.add("open");
  if (id === "historyPanel") renderHistory();
}
function closePanels() { document.querySelectorAll(".panel").forEach(p => p.classList.remove("open")); }
function clearChat() {
  if (isSending) return;
  saveCurrentSession();
  conversation = []; currentSessionId = null; pending = []; lastFull = [];
  renderPreviews(); input.value = ""; autoGrow(); renderAll(); closePanels(); renderHistory();
}
function clearAllHistory() {
  if (isSending || !confirm("Delete all saved conversations?")) return;
  savedSessions = []; persistSessions();
  conversation = []; currentSessionId = null; renderAll(); renderHistory(); closePanels();
}
function suggest(text) { input.value = text; sendMessage(); }

/* ---------- sending ---------- */
function setSending(on) {
  isSending = on;
  sendBtn.textContent = on ? "■" : "↑";
  sendBtn.title = on ? "Stop" : "Send";
  document.getElementById("attach").disabled = on;
}
function onSendClick() { if (isSending) abortCtl && abortCtl.abort(); else sendMessage(); }

function buildPayload(fullImages) {
  return conversation.map((m, i) => {
    const o = { role: m.role, content: m.content };
    if (m.role === "user") {
      const isLast = i === conversation.length - 1;
      if (isLast && fullImages.length) o.images = fullImages;
      else if (m.images && m.images.length) o.imageCount = m.images.length;
    }
    return o;
  });
}

async function sendMessage() {
  if (isSending) return;
  const text = input.value.trim();
  if (!text && !pending.length) return;

  const thumbs = pending.map(p => p.thumb);
  lastFull = pending.map(p => p.full);
  const msg = { role: "user", content: text, images: thumbs.length ? thumbs : undefined };
  conversation.push(msg);
  pending = []; renderPreviews();
  input.value = ""; autoGrow(); closePanels();
  updateWelcome();
  const userBox = buildMessage(msg); userBox.classList.add("enter"); chat.appendChild(userBox); scrollDown(true);
  saveCurrentSession();
  await streamReply();
}

async function regenerate() {
  if (isSending) return;
  if (conversation.length && conversation[conversation.length - 1].role === "assistant") conversation.pop();
  if (!conversation.length || conversation[conversation.length - 1].role !== "user") return;
  renderAll();
  const last = conversation[conversation.length - 1];
  if (!lastFull.length && last.images) lastFull = last.images; // fall back to saved thumbnails
  await streamReply();
}

async function streamReply() {
  setSending(true);
  abortCtl = new AbortController();

  const botMsg = { role: "assistant", content: "" };
  const box = buildMessage(botMsg);
  box.classList.add("enter");
  box._content.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
  chat.appendChild(box); scrollDown(true);

  // Smooth typewriter: text arrives in bursts, but is revealed evenly,
  // speeding up if it falls behind.
  let acc = "", shown = 0, rafId = 0, drainResolve = null;
  const tick = () => {
    rafId = 0;
    if (shown < acc.length) {
      if (shown === 0) box._content.classList.add("fresh");
      const lag = acc.length - shown;
      shown = Math.min(acc.length, shown + Math.max(2, Math.ceil(lag / 10)));
      const c = acc.charCodeAt(shown - 1);
      if (c >= 0xD800 && c <= 0xDBFF && shown < acc.length) shown++; // don't split emoji
      box._content.innerHTML = md(acc.slice(0, shown));
      if (nearBottom()) scrollDown(false);
    }
    if (shown < acc.length) rafId = requestAnimationFrame(tick);
    else if (drainResolve) { drainResolve(); drainResolve = null; }
  };
  const kick = () => { if (!rafId) rafId = requestAnimationFrame(tick); };
  const drain = () => new Promise(r => { if (shown >= acc.length) return r(); drainResolve = r; kick(); });

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: abortCtl.signal,
      body: JSON.stringify({
        messages: buildPayload(lastFull),
        tone: toneEl.value,
        mode: modeEl.value,
        custom: customEl.value
      })
    });

    if (!response.ok) {
      const data = await response.json().catch(() => ({}));
      throw new Error(data.error || "Server error: " + response.status);
    }

    const reader = response.body.getReader();
    const dec = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      acc += dec.decode(value, { stream: true });
      kick();
    }
    acc += dec.decode();
    if (!acc.trim()) throw new Error("AI returned an empty response.");
    await drain();
    botMsg.content = acc;
    conversation.push(botMsg);
    addActions(box, acc); refreshRegenButtons();
    scrollDown(true);
  } catch (error) {
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    if (error.name === "AbortError") {
      const partial = acc.slice(0, shown);
      if (partial.trim()) {
        box._content.innerHTML = md(partial);
        botMsg.content = partial; conversation.push(botMsg);
        addActions(box, partial); refreshRegenButtons();
      } else box.remove();
    } else {
      box._content.textContent = "\u26a0\ufe0f " + error.message;
      console.error("FlashMind error:", error);
    }
  } finally {
    setSending(false); abortCtl = null;
    saveCurrentSession(); input.focus();
  }
}

/* ---------- input behaviour ---------- */
function autoGrow() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; }
input.addEventListener("input", autoGrow);
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMessage(); }
});

/* ---------- spatial depth: parallax + tilt (mouse only) ---------- */
(function () {
  const fine = matchMedia("(hover:hover) and (pointer:fine)").matches;
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!fine || calm) return;
  const root = document.documentElement;
  let raf = 0, px = 0, py = 0;
  document.addEventListener("pointermove", e => {
    px = e.clientX / innerWidth * 2 - 1;
    py = e.clientY / innerHeight * 2 - 1;
    if (!raf) raf = requestAnimationFrame(() => {
      raf = 0;
      root.style.setProperty("--px", px.toFixed(3));
      root.style.setProperty("--py", py.toFixed(3));
    });
    const el = e.target.closest && e.target.closest(".tilt");
    if (!el) return;
    const r = el.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    const max = el.classList.contains("bot") ? 2.5 : 8;
    el.style.setProperty("--rx", ((0.5 - y) * max).toFixed(2) + "deg");
    el.style.setProperty("--ry", ((x - 0.5) * max).toFixed(2) + "deg");
    el.style.setProperty("--mx", (x * 100).toFixed(1) + "%");
    el.style.setProperty("--my", (y * 100).toFixed(1) + "%");
  }, { passive: true });
  document.addEventListener("pointerout", e => {
    const el = e.target.closest && e.target.closest(".tilt");
    if (el && !el.contains(e.relatedTarget)) {
      el.style.setProperty("--rx", "0deg");
      el.style.setProperty("--ry", "0deg");
    }
  });
})();

loadSettings(); renderHistory(); updateWelcome();
</script>
</body>
</html>
