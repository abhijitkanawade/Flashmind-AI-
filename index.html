<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070913">
<title>FlashMind AI</title>

<style>
:root {
  --glass-bg: rgba(22, 27, 48, 0.55);
  --glass-border: rgba(255, 255, 255, 0.14);
  --glass-highlight: rgba(255, 255, 255, 0.08);
  --accent-1: #8a5cff;
  --accent-2: #24d2f2;
  --text-main: #f5f7ff;
  --text-muted: #9ba1be;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background-color: #070913;
  background-image: 
    radial-gradient(circle at 15% 15%, rgba(138, 92, 255, 0.22), transparent 42%),
    radial-gradient(circle at 85% 25%, rgba(36, 210, 242, 0.18), transparent 40%),
    radial-gradient(circle at 50% 85%, rgba(98, 70, 234, 0.16), transparent 45%);
  background-attachment: fixed;
  color: var(--text-main);
  min-height: 100vh;
  overflow-x: hidden;
}

.app {
  max-width: 850px;
  margin: auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 14px;
}

/* VisionOS Spatial Glass Header */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: var(--glass-bg);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--glass-border);
  border-radius: 22px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.15);
  position: sticky;
  top: 10px;
  z-index: 20;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
  display: grid;
  place-items: center;
  font-size: 22px;
  font-weight: bold;
  box-shadow: 0 4px 16px rgba(138, 92, 255, 0.45);
}

.brand h2 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.2px;
}

.brand p {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.icon-btn, .clear {
  border: 1px solid var(--glass-border);
  background: rgba(255, 255, 255, 0.06);
  color: #e2e5ff;
  border-radius: 13px;
  padding: 8px 12px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  backdrop-filter: blur(12px);
  transition: all 0.2s ease;
}

.icon-btn:active, .clear:active {
  transform: scale(0.95);
  background: rgba(255, 255, 255, 0.14);
}

/* Chat History Drawer */
.history-panel {
  display: none;
  margin-top: 10px;
  padding: 14px;
  background: rgba(18, 22, 40, 0.78);
  backdrop-filter: blur(26px);
  -webkit-backdrop-filter: blur(26px);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
  animation: slideFade 0.25s ease;
}

.history-panel.open {
  display: block;
}

.history-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  font-size: 12px;
  color: var(--text-muted);
}

.history-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 180px;
  overflow-y: auto;
}

.history-item {
  padding: 10px 12px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.08);
  font-size: 12px;
  color: #dfe3ff;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.history-item:active {
  background: rgba(138, 92, 255, 0.22);
}

/* Welcome Section */
.welcome {
  text-align: center;
  margin: 48px 0 28px;
  animation: floatIn 0.5s ease;
}

.welcome .brain {
  width: 68px;
  height: 68px;
  margin: 0 auto 16px;
  border-radius: 22px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(16px);
  display: grid;
  place-items: center;
  font-size: 34px;
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255,255,255,0.2);
}

.welcome h1 {
  font-size: clamp(26px, 6.5vw, 40px);
  font-weight: 800;
  background: linear-gradient(90deg, #c4b0ff, #6be5ff);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}

.welcome p {
  color: var(--text-muted);
  font-size: 14px;
  margin-top: 10px;
}

/* Spatial Suggestion Cards */
.suggestions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 22px;
}

.suggestion {
  border: 1px solid var(--glass-border);
  background: var(--glass-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  color: #e8eaff;
  border-radius: 18px;
  padding: 15px;
  text-align: left;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255,255,255,0.1);
  transition: transform 0.2s ease, background 0.2s ease;
}

.suggestion:active {
  transform: scale(0.97);
  background: rgba(138, 92, 255, 0.18);
}

.suggestion span {
  display: block;
  font-size: 21px;
  margin-bottom: 8px;
}

/* Chat Stream */
#chat {
  display: flex;
  flex-direction: column;
  gap: 14px;
  flex: 1;
  padding: 12px 0 24px;
}

.message {
  max-width: 88%;
  padding: 14px 16px;
  border-radius: 20px;
  font-size: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  animation: slideFade 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.user {
  align-self: flex-end;
  background: linear-gradient(135deg, rgba(138, 92, 255, 0.9), rgba(58, 123, 213, 0.9));
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-bottom-right-radius: 6px;
  box-shadow: 0 8px 24px rgba(101, 72, 203, 0.35);
}

.bot {
  align-self: flex-start;
  background: var(--glass-bg);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  border: 1px solid var(--glass-border);
  border-bottom-left-radius: 6px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.12);
}

.bot-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.8px;
  color: #9da8ff;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 5px;
}

/* Animated Typing Dots */
.typing-dots {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 2px;
}

.typing-dots span {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #a5b0ff;
  animation: pulseDot 1.3s infinite ease-in-out;
}

.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }

/* Floating Spatial Composer */
.composer {
  position: sticky;
  bottom: 8px;
  padding: 8px 0 4px;
  z-index: 20;
}

.inputbox {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(22, 27, 48, 0.72);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 22px;
  padding: 8px 10px 8px 16px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.15);
}

input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  font-size: 14px;
  padding: 10px 0;
}

input::placeholder {
  color: #8f96b8;
}

#send {
  border: 0;
  border-radius: 15px;
  background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
  color: white;
  width: 42px;
  height: 42px;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(138, 92, 255, 0.4);
  transition: transform 0.18s ease, opacity 0.2s ease;
}

#send:active {
  transform: scale(0.92);
}

#send:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.note {
  text-align: center;
  color: #7c82a2;
  font-size: 10px;
  margin-top: 9px;
}

@keyframes slideFade {
  from { opacity: 0; transform: translateY(10px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes floatIn {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulseDot {
  0%, 80%, 100% { transform: scale(0.7); opacity: 0.45; }
  40% { transform: scale(1.15); opacity: 1; }
}

@media(max-width: 480px) {
  .app { padding: 12px; }
  .welcome { margin: 36px 0 24px; }
  .message { max-width: 92%; }
}
</style>
</head>

    <div>
      <h2>FlashMind AI</h2>
      <p>Spatial Intelligence · Active</p>

</div>
